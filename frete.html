<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form>
            <div class="row mt-5">
                <h1>Sender</h1>
            </div>
            <div class="row">
                <div class="col-3">
                    <input type="text" class="form-control" placeholder="Name">
                </div>
                <div class="col-3">
                    <input type="text" class="form-control" placeholder="Surname">
                </div>
                <div class="col-3">
                    <input type="email" class="form-control" placeholder="E-Mail">
                </div>
                <div class="col-1">
                    <input type="number" class="form-control" placeholder="DDD" id="indicativo">
                </div>
                <div class="col-2">
                    <input type="text" class="form-control" placeholder="Number" id="cellphone">
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-3 d-flex">
                    <input type="text" class="form-control" placeholder="CEP" id="cep">
                    <button type="button" class="btn btn-primary" id="btn-buscar-cep">
                        <i class="bi bi-search"></i>
                        <span class="d-none spinner-border spinner-border-sm"></span>
                    </button>
                </div>
                <div class="col-8">
                    <input type="text" class="form-control" placeholder="Adress" id="endereco">
                </div>
                <div class="col-1">
                    <input type="number" class="form-control" placeholder="AdressNumb" id="numbMorada">
                </div>
            </div>
            <div class="row mt-5">
                <h1>Reciever</h1>
            </div>
            <div class="row">
                <div class="col-3 d-flex">
                    <input type="text" class="form-control" placeholder="CEP" id="cep2">
                    <button type="button" class="btn btn-primary" id="btn-buscar-cep2">
                        <i class="bi bi-search"></i>
                        <span class="d-none spinner-border spinner-border-sm"></span>
                    </button>
                </div>
                <div class="col-7">
                    <input type="text" class="form-control" placeholder="Adress" id="adress">
                </div>
                <div class="col-2">
                    <input type="text" class="form-control" placeholder="AdressNumber">
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-2">
                    <input type="number" class="form-control" placeholder="DDD" id="indicativo2">
                </div>
                <div class="col-3">
                    <input type="text" class="form-control" placeholder="Number" id="cellphone2">
                </div>
                <div class="col-7">
                    <input type="text" class="form-control" placeholder="RecieverName">
                </div>
            </div>
            
            <div class="row" id="photos">
                <div>
                    <h2>Attach - Package Photo</h2>
                    <div class="row">
                        <div id="attach">
                            <input type="file" id="fileUpload" hidden>
                            <button type="button" class="btn btn-link" id="uploadBtn">
                                <i class="bi bi-plus-circle-fill"></i>
                            </button>
                        </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mt-5">
                <button type="submit" class="btn btn-success">Calculate Transportation</button>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="jquery.js"></script>
    <script src="jquery.mask.min.js"></script>
    <script src="fetch.js"></script>
    <script src="main.js"></script>
</body>
</html>
